<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Нить Ариадны — Ателье</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Нить Ариадны</div>

    <nav id="nav">
        <a href="#services">Услуги</a>
        <a href="#booking">Запись</a>
        <a href="#contacts">Контакты</a>
    </nav>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<!-- HERO -->
<section class="hero">
    <h1>Ремонт и пошив одежды</h1>
    <p>Быстро. Аккуратно. Качественно.</p>
</section>

<!-- УСЛУГИ -->
<section class="section" id="services">
    <h2>Услуги</h2>
    <p>Ремонт, пошив и подгонка одежды</p>
</section>

<!-- ФОРМА -->
<section class="section" id="booking">
    <h2>Запись</h2>

    <form action="https://formspree.io/f/xwvabaqn" method="POST" class="form">

        <input type="text" name="name" placeholder="Имя" required>

        <input type="tel" name="phone" placeholder="Телефон" required>

        <!-- ФИЛИАЛ -->
        <label>Выберите ателье</label>
        <select name="branch" required>
            <option value="">-- выберите --</option>
            <option value="Ульянова 114">Ульянова 114</option>
            <option value="Гастелло 40A">Гастелло 40A</option>
        </select>

        <textarea name="message" placeholder="Что нужно сделать?" required></textarea>

        <!-- 🔥 ВАЖНО: ТЕМА ПИСЬМА -->
        <input type="hidden" name="_subject" value="🧵 ЗАЯВКА — Нить Ариадны">

        <button type="submit">Отправить заявку</button>

    </form>
</section>

<!-- КОНТАКТЫ -->
<section class="section" id="contacts">
    <h2>Контакты</h2>

    <p>📍 Ульянова 114 — +7 (918) 615-49-45</p>
    <p>📍 Гастелло 40A — +7 (988) 164-04-33</p>

</section>

<footer>
    © 2026 Нить Ариадны
</footer>

<script src="script.js"></script>

</body>
</html>
